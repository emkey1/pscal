<svg width="100%" viewBox="0 0 680 610" xmlns="http://www.w3.org/2000/svg" role="img">
<title>PSCAL VM 2.0 architecture</title>
<desc>Five frontend languages (Pascal, Rea, CLike, Aether, exsh) compile to a shared, verified PSB3 bytecode format executed by one VM core containing a load-time verifier, an effect-based sandbox with record/replay, and task/channel concurrency. Builtins reach native libraries either through static in-tree categories or, new in this work, a sandboxed dlopen plugin ABI. Green highlights the two capabilities most relevant to running untrusted or agentic code safely: the effect sandbox and the plugin ABI.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- Row 1: Frontends -->
<rect class="box" x="40" y="50" width="100" height="54" rx="8"/>
<text class="th" x="90" y="82" text-anchor="middle">Pascal</text>
<rect class="box" x="165" y="50" width="100" height="54" rx="8"/>
<text class="th" x="215" y="82" text-anchor="middle">Rea</text>
<rect class="box" x="290" y="50" width="100" height="54" rx="8"/>
<text class="th" x="340" y="82" text-anchor="middle">CLike</text>
<rect class="box" x="415" y="50" width="100" height="54" rx="8"/>
<text class="th" x="465" y="82" text-anchor="middle">Aether</text>
<rect class="box" x="540" y="50" width="100" height="54" rx="8"/>
<text class="th" x="590" y="82" text-anchor="middle">exsh</text>

<line x1="340" y1="104" x2="340" y2="138" class="arr" marker-end="url(#arrow)"/>

<!-- Row 2: Shared compiler -->
<rect class="box" x="140" y="140" width="400" height="60" rx="8"/>
<text class="th" x="340" y="164" text-anchor="middle">Frontend-agnostic compiler</text>
<text class="ts" x="340" y="182" text-anchor="middle">AST → immutable PSB3 bytecode</text>

<line x1="340" y1="200" x2="340" y2="232" class="arr" marker-end="url(#arrow)"/>

<!-- Row 3: VM core (structural container) -->
<g class="c-gray">
  <rect x="40" y="232" width="600" height="152" rx="20" stroke-width="0.5"/>
  <text class="th" x="340" y="260" text-anchor="middle">PSCAL VM 2.0</text>
  <text class="ts" x="340" y="278" text-anchor="middle">growable stacks &amp; globals</text>
</g>
<g>
  <rect class="box" x="60" y="294" width="160" height="64" rx="10"/>
  <text class="th" x="140" y="322" text-anchor="middle">Bytecode verifier</text>
  <text class="ts" x="140" y="340" text-anchor="middle">load-time checks</text>
</g>
<g class="c-green">
  <rect x="260" y="294" width="160" height="64" rx="10" stroke-width="0.5"/>
  <text class="th" x="340" y="322" text-anchor="middle">Effect sandbox</text>
  <text class="ts" x="340" y="340" text-anchor="middle">--deny / replay</text>
</g>
<g>
  <rect class="box" x="460" y="294" width="160" height="64" rx="10"/>
  <text class="th" x="540" y="322" text-anchor="middle">Concurrency</text>
  <text class="ts" x="540" y="340" text-anchor="middle">tasks &amp; channels</text>
</g>

<line x1="340" y1="384" x2="340" y2="416" class="arr" marker-end="url(#arrow)"/>

<!-- Row 4: Builtin registry -->
<rect class="box" x="90" y="418" width="230" height="60" rx="8"/>
<text class="th" x="205" y="442" text-anchor="middle">Static builtins</text>
<text class="ts" x="205" y="460" text-anchor="middle">math, sqlite, json, HTTP</text>

<g class="c-green">
  <rect x="360" y="418" width="230" height="60" rx="8" stroke-width="0.5"/>
  <text class="th" x="475" y="442" text-anchor="middle">Plugin ABI — new</text>
  <text class="ts" x="475" y="460" text-anchor="middle">dlopen, sandboxed load</text>
</g>

<line x1="340" y1="478" x2="340" y2="510" class="arr" marker-end="url(#arrow)"/>

<!-- Row 5: OS / native -->
<rect class="box" x="90" y="512" width="500" height="56" rx="8"/>
<text class="th" x="340" y="536" text-anchor="middle">OS &amp; native libraries</text>
<text class="ts" x="340" y="554" text-anchor="middle">sqlite3, libcurl, pthreads, .dylib/.so</text>

<!-- Legend -->
<text class="ts" x="340" y="590" text-anchor="middle">Green = agentic-relevant: sandboxing and plugin extensibility</text>
</svg>
